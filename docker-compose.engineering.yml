services:
  engineering-calculator:
    build:
      context: .
      dockerfile: Dockerfile.engineering
    image: engineering-calculator:latest
    container_name: engineering-calculator
    environment:
      # macOS + XQuartz: allow GUI from container
      - DISPLAY=host.docker.internal:0
    volumes:
      - ./:/app
    working_dir: /app
    command: ["python", "engineering_calculator.py"]
